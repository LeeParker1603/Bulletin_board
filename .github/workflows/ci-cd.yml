name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Этап ТЕСТЫ (SQLite + pytest с покрытием >= 75%)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          SECRET_KEY: 'test_secret_key_for_ci_pipeline'
          DEBUG: 'True'
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=75

  # 2. Этап ЛИНТЕР (запускается после успешных тестов)
  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 linter
        run: flake8 .

  # 3. Этап ПРОВЕРКА СБОРКИ DOCKER
  build:
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sb1_bulletin_board:test .

  # 4. Этап АВТО-ДЕПЛОЙ НА СЕРВЕР
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/Bulletin_board
            cd /home/${{ secrets.SERVER_USER }}/Bulletin_board

            if [ ! -d ".git" ]; then
              rm -f .env
              git clone https://github.com/LeeParker1603/Bulletin_board .
              git checkout develop
            else
              git fetch --all
              git checkout develop
              git reset --hard origin/develop
            fi

            cat << 'EOF' > .env
            SECRET_KEY='${{ secrets.SECRET_KEY }}'
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}

            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=db
            POSTGRES_PORT=5432

            WEB_PORT=8083

            EMAIL_BACKEND=${{ secrets.EMAIL_BACKEND }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USE_SSL=${{ secrets.EMAIL_USE_SSL }}
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            EOF

            docker compose down
            docker compose up -d --build

            echo "Ожидание запуска базы данных..."
            for i in {1..30}; do
              if docker compose exec -T db pg_isready -U "${{ secrets.POSTGRES_USER }}" -d "${{ secrets.POSTGRES_DB }}"; then
                echo "База данных готова к работе!"
                break
              fi
              sleep 1
            done